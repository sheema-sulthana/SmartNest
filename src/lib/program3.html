c. Write a JavaScript program to implement the event listeners
  
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Event Listeners</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f7;
      padding: 20px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    button, input {
      margin: 10px 0;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      transition: background 0.3s;
    }

    button {
      background-color: #3498db;
      color: white;
    }

    button:hover {
      background-color: #2980b9;
      cursor: pointer;
    }

    #hoverBox {
      width: 200px;
      height: 60px;
      background-color: lightblue;
      text-align: center;
      line-height: 60px;
      margin: 15px auto;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.3s, background 0.3s;
    }

    #hoverBox:hover {
      transform: scale(1.05);
      background-color: #5dade2;
      color: white;
    }

    #output {
      margin-top: 20px;
      font-size: 18px;
      color: darkblue;
      background: #d6eaf8;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #aed6f1;
      width: 60%;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <h2>JavaScript Event Listeners Demo</h2>

  <!-- Elements for various events -->
  <button id="clickBtn">Click Me</button><br>
  <button id="dblClickBtn">Double Click Me</button><br>

  <div id="hoverBox">
    Hover over me
  </div><br>

  <input type="text" id="textInput" placeholder="Type something here"><br>

  <!-- Output area -->
  <p id="output">Event messages will appear here.</p>

  <script>
    // Get references to elements
    const output = document.getElementById("output");
    const clickBtn = document.getElementById("clickBtn");
    const dblClickBtn = document.getElementById("dblClickBtn");
    const hoverBox = document.getElementById("hoverBox");
    const textInput = document.getElementById("textInput");

    // Click event
    clickBtn.addEventListener("click", () => {
      output.innerText = "Button clicked!";
    });

    // Mouse enter
    clickBtn.addEventListener("mouseenter", () => {
      output.innerText = "Mouse is over the Click button!";
    });

    // Mouse leave
    clickBtn.addEventListener("mouseleave", () => {
      output.innerText = "Mouse left the Click button!";
    });

    // Double click
    dblClickBtn.addEventListener("dblclick", () => {
      output.innerText = "Button double-clicked!";
    });

    

    // Hover over box
    hoverBox.addEventListener("mouseover", () => {
      output.innerText = "Mouse is over the box!";
    });

    hoverBox.addEventListener("mouseout", () => {
      output.innerText = "Mouse left the box!";
    });

    // Typing in text input
    textInput.addEventListener("keyup", () => {
      output.innerText = "You typed: " + textInput.value;
    });

    // Keydown in input
    textInput.addEventListener("keydown", (event) => {
      output.innerText = `Key pressed: ${event.key}`;
    });

    // Focus event
    textInput.addEventListener("focus", () => {
      output.innerText = "Input box focused!";
    });

    // Blur event (when leaving input)
    textInput.addEventListener("blur", () => {
      output.innerText = "Input box lost focus!";
    });

    // Scroll / wheel event on box
    hoverBox.addEventListener("wheel", () => {
      output.innerText = "Mouse wheel used over the box!";
    });
  </script>

</body>
</html>
